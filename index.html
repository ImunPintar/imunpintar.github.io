
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102D82">
  <title>Konsultasi Telepon | ImunPintar.id</title>
  <meta name="description" content="Hubungi ImunPintar.id untuk konsultasi dan informasi pemesanan produk 4Life.">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #102D82;
      font-family: Arial, sans-serif;
      color: #102D82;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,.18);
    }

    .symbol {
      font-size: 42px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 26px;
      margin: 0 0 10px;
    }

    p {
      color: #53617A;
      line-height: 1.6;
      font-size: 15px;
    }

    .number {
      font-size: 21px;
      font-weight: bold;
      margin: 26px 0;
    }

    .call {
      display: block;
      background: #102D82;
      color: white;
      padding: 17px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
    }

    .call:focus-visible {
      outline: 3px solid #537FE7;
      outline-offset: 4px;
    }

    .note {
      margin-top: 22px;
      font-size: 12px;
      color: #667085;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="symbol">📞</div>

    <h1>ImunPintar.id</h1>

    <p>
      Distributor Independen 4Life<br>
      Konsultasi dan Informasi Produk
    </p>

    <div class="number">0812-8169-2299</div>

    <a class="call" href="tel:+6281281692299">
      📞 Telepon Sekarang
    </a>

    <p class="note">
      Tekan tombol di atas untuk membuka
      aplikasi telepon di perangkat Anda.
      Tarif panggilan mengikuti operator.
    </p>
  </main>
</body>
</html>
